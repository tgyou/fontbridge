name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build release ZIP
        run: python tools/package_release.py
      - name: Check tag matches addon version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' FontBridge.toc)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match FontBridge.toc version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FontBridge-release
          path: dist/FontBridge-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FontBridge-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/FontBridge-*.zip --title "FontBridge $GITHUB_REF_NAME" --generate-notes
